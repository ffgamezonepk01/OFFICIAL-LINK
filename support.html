<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>FF GameZone PK - Support</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* --- GLOBAL SETTINGS --- */
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none; 
            -webkit-user-select: none;
            box-sizing: border-box;
        }

        body {
            margin: 0; padding: 0;
            background-color: #050a14;
            font-family: 'Poppins', sans-serif;
            color: #ffffff;
            display: flex; flex-direction: column;
            height: 100vh; overflow: hidden;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
        }

        .header {
            display: flex; align-items: center; justify-content: flex-start;
            padding: 0 15px; background: #0d141f;
            border-bottom: 2px solid #FFD700;
            height: 70px; flex-shrink: 0; gap: 15px;
        }

        .back-arrow { cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 5px; }
        .back-arrow svg { width: 30px; height: 30px; fill: #ffffff; }

        .header-content { display: flex; align-items: center; gap: 12px; }
        .header img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #FFD700; }
        .header h1 { font-size: 14px; color: #FFD700; margin: 0; }
        #admin-info { font-size: 11px; color: #25d366; display: block; }

        .selection-header {
            position: fixed; top: 0; left: 0; width: 100%; height: 70px;
            background: #005c4b; display: none; align-items: center;
            padding: 0 15px; justify-content: space-between; z-index: 2000;
        }

        .header-tools { display: flex; gap: 25px; align-items: center; }
        .header-tools svg { width: 22px; height: 22px; fill: #fff; cursor: pointer; }

        #chat-box {
            flex: 1; overflow-y: auto; padding: 15px 0;
            display: flex; flex-direction: column; gap: 8px;
            background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            background-blend-mode: overlay; background-color: #050a14;
            scroll-behavior: smooth;
        }

        .message-container { width: 100%; display: flex; flex-direction: column; transition: background 0.1s; }
        .message-container.selected { background-color: rgba(37, 110, 255, 0.25); }

        .message {
            max-width: 80%; padding: 8px 12px; border-radius: 12px;
            font-size: 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.5);
            position: relative; word-wrap: break-word;
        }

        .msg-sent { align-self: flex-end; background: #005c4b; margin-right: 15px; border-top-right-radius: 2px; }
        .msg-received { align-self: flex-start; background: #1e2a33; margin-left: 15px; border-top-left-radius: 2px; }

        .message img, .message video { max-width: 100%; border-radius: 8px; display: block; }

        #media-preview-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000;
            display: none; flex-direction: column; z-index: 3000;
        }
        .preview-container { flex: 1; display: flex; align-items: center; justify-content: center; }
        #preview-img, #preview-video { max-width: 95%; max-height: 80vh; display: none; }

        #delete-dialog {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 4000;
        }
        .dialog-box { background: #1e2a33; width: 85%; max-width: 320px; padding: 20px; border-radius: 10px; }
        .dialog-btns { display: flex; flex-direction: column; gap: 18px; align-items: flex-end; margin-top: 10px; }
        .dialog-btns span { color: #00a884; font-weight: 600; cursor: pointer; text-transform: uppercase; }

        .footer { padding: 8px 10px; display: flex; align-items: center; gap: 8px; background: #050a14; }
        .input-bar { flex: 1; background: #1e2a33; border-radius: 25px; display: flex; align-items: center; padding: 0 12px; height: 42px; }
        .input-bar input { flex: 1; background: transparent; border: none; color: #ffffff; padding: 5px; outline: none; font-size: 14px; }
        .action-btn { width: 42px; height: 42px; background: #FFD700; border-radius: 50%; display: flex; justify-content: center; align-items: center; border: none; }
        .action-btn svg { width: 20px; height: 20px; fill: #000; }
        .msg-icon { color:#8696a0; display: flex; align-items: center; margin-right: 5px; }
    </style>
</head>
<body>

    <div class="header" id="main-header">
        <div class="back-arrow" onclick="goBack()">
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </div>
        <div class="header-content">
            <img src="https://i.ibb.co/S4k4TFTG/1777131751749.png" alt="Logo">
            <div>
                <h1 id="chat-title">FF GamerZone PK</h1>
                <span id="admin-info" style="display:none;">Admin Mode</span>
            </div>
        </div>
    </div>

    <div class="selection-header" id="select-header">
        <div style="display: flex; align-items: center; gap: 15px;">
            <svg onclick="cancelSelection()" viewBox="0 0 24 24" style="width: 24px; fill: #fff;"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            <span id="select-count">1</span>
        </div>
        <div class="header-tools">
            <svg onclick="copyMessage()" viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
            <svg onclick="showDeleteDialog()" viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
        </div>
    </div>

    <div id="chat-box" onclick="backgroundClick(event)"></div>

    <div id="media-preview-overlay">
        <div style="padding:15px;"><span onclick="closePreview()" style="font-size:24px; cursor:pointer;">✕</span></div>
        <div class="preview-container">
            <img id="preview-img">
            <video id="preview-video" controls autoplay></video>
        </div>
        <div style="padding:20px; display:flex; justify-content:flex-end;">
            <button class="action-btn" onclick="sendMedia()"><svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
        </div>
    </div>

    <div id="delete-dialog">
        <div class="dialog-box">
            <p style="margin:0 0 20px 0; font-size:16px;">Delete message?</p>
            <div class="dialog-btns">
                <span onclick="confirmDelete()">Delete for everyone</span>
                <span onclick="confirmDelete()">Delete for me</span>
                <span onclick="closeDeleteDialog()" style="color:#8696a0">Cancel</span>
            </div>
        </div>
    </div>

    <div class="footer">
        <div class="input-bar">
            <div class="msg-icon"><svg viewBox="0 0 24 24" style="width:20px; fill:#8696a0;"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg></div>
            <input type="text" id="msg-input" placeholder="Message" autocomplete="off">
            <div style="display:flex; gap:10px; color:#8696a0; font-size:18px;">
                <label><input type="file" id="file-input" hidden accept="image/*,video/*">📎</label>
                <span onclick="document.getElementById('file-input').click()" style="cursor:pointer;">📷</span>
            </div>
        </div>
        <button class="action-btn" id="main-btn">
            <svg id="icon-svg" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
        </button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, serverTimestamp, remove, update, get } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyANjbQLKEpV0Mj5e5PJzCPZvFo8a5vzy_k",
            authDomain: "ff-tournamint-323ac.firebaseapp.com",
            databaseURL: "https://ff-tournamint-323ac-default-rtdb.firebaseio.com",
            projectId: "ff-tournamint-323ac",
            storageBucket: "ff-tournamint-323ac.firebasestorage.app",
            appId: "1:157085748163:web:848536d10ae58d32398b76"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // UI Elements
        const chatBox = document.getElementById('chat-box');
        const msgInput = document.getElementById('msg-input');
        const mainBtn = document.getElementById('main-btn');
        const selectHeader = document.getElementById('select-header');
        const mediaOverlay = document.getElementById('media-preview-overlay');
        const previewImg = document.getElementById('preview-img');
        const previewVid = document.getElementById('preview-video');
        const iconSvg = document.getElementById('icon-svg');

        // State
        let selectedContainer = null;
        let pressTimer = null;
        let currentMedia = { data: "", type: "" };
        let isVoiceMode = true;
        let mediaRecorder;
        let audioChunks = [];

        // URL Params Logic
        const urlParams = new URLSearchParams(window.location.search);
        const isAdmin = urlParams.get('mode') === 'admin';
        
        // Target User ID Determination
        let userId = urlParams.get('uid');
        if (!isAdmin) {
            let rawId = localStorage.getItem('userEmail');
            if(!rawId) {
                rawId = "user_" + Date.now();
                localStorage.setItem('userEmail', rawId);
            }
            userId = rawId.replace(/[.#$\[\]]/g, "_");
        }

        let userName = urlParams.get('name') ? decodeURIComponent(urlParams.get('name')) : localStorage.getItem('userName');
        if(!userName) {
            userName = "FF Player";
            localStorage.setItem('userName', userName);
        }

        if(isAdmin) {
            document.getElementById('chat-title').innerText = userName;
            document.getElementById('admin-info').style.display = "block";
        }

        window.goBack = function() {
            window.location.href = isAdmin ? 'admin-chats.html' : 'profile.html';
        };

        // --- Firebase Realtime Listener ---
        const messagesRef = ref(db, 'chats/' + userId);
        onValue(messagesRef, (snapshot) => {
            chatBox.innerHTML = "";
            if (snapshot.exists()) {
                const data = snapshot.val();
                Object.entries(data).forEach(([key, msg]) => {
                    renderMessageUI(msg.content, msg.type, msg.sender, key);
                });
            }
        });

        function renderMessageUI(content, type, sender, key) {
            const container = document.createElement('div');
            container.className = 'message-container';
            container.dataset.key = key;
            
            const msgDiv = document.createElement('div');
            let directionClass = (sender === (isAdmin ? 'admin' : 'user')) ? 'msg-sent' : 'msg-received';
            msgDiv.className = `message ${directionClass}`;
            
            if(type === 'image') msgDiv.innerHTML = `<img src="${content}">`;
            else if(type === 'video') msgDiv.innerHTML = `<video src="${content}" controls></video>`;
            else if(type === 'audio') {
                msgDiv.style.background = directionClass === 'msg-sent' ? "#075e54" : "#1e2a33";
                msgDiv.innerHTML = `<audio src="${content}" controls style="height:35px; width:210px;"></audio>`;
            }
            else msgDiv.innerText = content;
            
            container.appendChild(msgDiv);
            addMessageEvents(container);
            chatBox.appendChild(container);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage(content, type) {
            const senderType = isAdmin ? 'admin' : 'user';
            const timestamp = Date.now();

            // 1. Save to Specific User Chat History
            await push(messagesRef, {
                content: content,
                type: type,
                sender: senderType,
                timestamp: serverTimestamp()
            });

            // 2. Update Admin List Metadata for this specific user node
            const userUpdateRef = ref(db, 'users/' + userId);
            let previewText = type === 'text' ? content : (type === 'image' ? "📷 Photo" : (type === 'video' ? "🎥 Video" : "🎤 Audio"));
            
            const updateData = {
                lastMessage: previewText,
                lastTimestamp: timestamp,
                userName: userName,
                userEmail: localStorage.getItem('userEmail') || userId,
                uid: userId
            };

            if(!isAdmin) {
                const userSnap = await get(userUpdateRef);
                const currentUnread = (userSnap.exists() && userSnap.val().unreadCount) ? userSnap.val().unreadCount : 0;
                updateData.unreadCount = currentUnread + 1;
            } else {
                updateData.unreadCount = 0;
            }

            await update(userUpdateRef, updateData);
        }

        // --- Interaction Logic ---
        function addMessageEvents(container) {
            container.onmousedown = container.ontouchstart = (e) => {
                if (selectedContainer) return;
                pressTimer = setTimeout(() => selectMessage(container), 600); 
            };
            container.onmouseup = container.ontouchend = () => clearTimeout(pressTimer);
            container.onclick = () => { if (selectedContainer === container) cancelSelection(); };
        }

        function selectMessage(element) {
            selectedContainer = element;
            element.classList.add('selected');
            selectHeader.style.display = 'flex';
            if(navigator.vibrate) navigator.vibrate(50);
        }

        window.cancelSelection = function() {
            if(selectedContainer) selectedContainer.classList.remove('selected');
            selectedContainer = null;
            selectHeader.style.display = 'none';
        }

        window.backgroundClick = function(e) { if(e.target === chatBox) cancelSelection(); }

        window.copyMessage = function() {
            if(selectedContainer) {
                const text = selectedContainer.querySelector('.message').innerText;
                if(text) navigator.clipboard.writeText(text);
                cancelSelection();
            }
        }

        window.showDeleteDialog = function() { document.getElementById('delete-dialog').style.display = 'flex'; }
        window.closeDeleteDialog = function() { document.getElementById('delete-dialog').style.display = 'none'; }
        
        window.confirmDelete = async function() { 
            if(selectedContainer) {
                const key = selectedContainer.dataset.key;
                await remove(ref(db, `chats/${userId}/${key}`));
            }
            closeDeleteDialog(); cancelSelection(); 
        }

        // --- Media Logic ---
        const fileInput = document.getElementById('file-input');
        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                currentMedia.data = ev.target.result;
                currentMedia.type = file.type.startsWith('video/') ? 'video' : 'image';
                if(currentMedia.type === 'video') {
                    previewImg.style.display = 'none';
                    previewVid.src = currentMedia.data; previewVid.style.display = 'block';
                } else {
                    previewVid.style.display = 'none';
                    previewImg.src = currentMedia.data; previewImg.style.display = 'block';
                }
                mediaOverlay.style.display = 'flex';
            };
            reader.readAsDataURL(file);
        };

        window.closePreview = function() { mediaOverlay.style.display = 'none'; previewVid.pause(); fileInput.value = ""; }
        window.sendMedia = function() { sendMessage(currentMedia.data, currentMedia.type); closePreview(); }

        // --- Input & Voice Logic ---
        msgInput.oninput = () => {
            if (msgInput.value.trim() !== "") {
                isVoiceMode = false;
                iconSvg.innerHTML = '<path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>';
            } else {
                isVoiceMode = true;
                iconSvg.innerHTML = '<path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>';
            }
        };

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/ogg; codecs=opus' });
                    const reader = new FileReader();
                    reader.onload = () => sendMessage(reader.result, 'audio');
                    reader.readAsDataURL(audioBlob);
                    stream.getTracks().forEach(t => t.stop());
                };
                mediaRecorder.start();
                mainBtn.style.transform = "scale(1.2)"; mainBtn.style.background = "#ff3b30";
            } catch (err) { alert("Mic access denied"); }
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== "inactive") {
                mediaRecorder.stop();
                mainBtn.style.transform = "scale(1)"; mainBtn.style.background = "#FFD700";
            }
        }

        mainBtn.onmousedown = mainBtn.ontouchstart = (e) => { if (isVoiceMode) { e.preventDefault(); startRecording(); } };
        mainBtn.onmouseup = mainBtn.ontouchend = () => { if (isVoiceMode) stopRecording(); };
        mainBtn.onclick = () => {
            if(!isVoiceMode && msgInput.value.trim()) { 
                sendMessage(msgInput.value, 'text'); 
                msgInput.value = ""; msgInput.oninput(); 
            }
        };
    </script>
</body>
</html>
