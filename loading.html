<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF Game Zone Loading</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #ffffff;
            overflow: hidden;
        }

        .main-loader-container {
            text-align: center;
            /* Tora sa chota krne ke liye container width kam ki gai hai */
            width: 70%; 
            max-width: 300px; 
        }

        .logo-box {
            position: relative;
            display: inline-block;
            margin-bottom: 15px; /* Thori spacing kam ki gai */
        }

        .logo-box img {
            /* Logo ko blur or glow dene ke liye properties */
            width: 80px; 
            height: 80px; 
            display: block;
            position: relative;
            z-index: 2;
            border-radius: 50%; 
            object-fit: cover; 
            border: 2px solid #FFD700; 
        }

        .logo-box::after {
            /* Piche glow effect dene ke liye */
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 95px;
            height: 95px;
            background: rgba(255, 230, 0, 0.35); 
            border-radius: 50%;
            filter: blur(20px); 
            z-index: 1;
        }

        .gold-text-main {
            font-weight: 700;
            font-size: 18px; 
            color: #FFD700;
            /* Text chamkane ke liye glow effect */
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.6); 
            margin: 0 0 5px 0;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .gold-text-sub {
            font-weight: 400;
            font-size: 10px; 
            color: #FFD700;
            opacity: 0.7;
            margin: 0 0 30px 0;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .spinner-container {
            position: relative;
            width: 45px; 
            height: 45px;
            margin: 0 auto 20px;
        }

        .spinner-circle {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 3px solid rgba(255, 255, 255, 0.05);
            border-top: 3px solid #FFD700; 
            border-radius: 50%;
            /* Spinner par bhi halka sa blur takay chamak aye */
            filter: blur(0.5px); 
            animation: spin 0.8s linear infinite; 
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .progress-bar-container {
            width: 60%; 
            margin: 0 auto;
            height: 2px; 
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            /* Line par blur takay glow lagay */
            filter: blur(0.3px); 
        }

        .progress-line {
            height: 100%;
            width: 0%;
            background: #FFD700;
            border-radius: 10px;
            animation: loadLine 0.8s ease-out forwards;
        }

        @keyframes loadLine {
            0% { width: 0%; }
            100% { width: 100%; }
        }

    </style>
</head>
<body>

    <div class="main-loader-container">
        
        <div class="logo-box">
            <img src="https://i.ibb.co/S4k4TFTG/1777131751749.png" alt="FF Game Zone Logo">
        </div>

        <h1 class="gold-text-main">FF Game Zone PK</h1>
        <p class="gold-text-sub">Tournament Platform</p>

        <div class="spinner-container">
            <div class="spinner-circle"></div>
        </div>

        <div class="progress-bar-container">
            <div class="progress-line"></div>
        </div>
    </div>

</body>
</html>
