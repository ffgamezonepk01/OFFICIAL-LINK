<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PROFILE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* --- GLOBAL TAP EFFECT REMOVAL --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent; 
            outline: none !important; 
        }

        body {
            background-color: #0d111d;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            padding: 20px;
            padding-bottom: 100px;
        }

        /* Loader ki styling */
        #globalLoaderEl {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0C0C27;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }

        .container {
            max-width: 450px;
            margin: 0 auto;
        }

        .top-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            padding: 10px 0;
        }

        .back-btn {
            font-size: 24px;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
        }

        .back-btn span {
            font-size: 22px;
            font-weight: bold;
        }

        .wallet-badge {
            background: linear-gradient(90deg, #ff4081, #ff5c8d);
            padding: 8px 15px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 4px 10px rgba(255, 64, 129, 0.3);
            cursor: pointer;
        }

        .wallet-badge i { font-size: 18px; }
        .add-icon {
            background: white;
            color: #ff4081;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .profile-img-box {
            position: relative;
            display: inline-block;
            width: 110px;
            height: 110px;
        }

        .profile-img, .profile-initial {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #ffcc00;
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: bold;
            background-color: #1a1f26;
            color: #ffcc00;
            text-transform: uppercase;
            position: relative;
            z-index: 2;
            animation: glow-border 2s infinite alternate;
        }

        @keyframes glow-border {
            0% { box-shadow: 0 0 5px #ffcc00; border-color: #ffcc00; }
            100% { box-shadow: 0 0 20px #ffcc00, 0 0 10px #ffcc00; border-color: #ffffff; }
        }

        .status-dot {
            height: 15px; width: 15px;
            background-color: #2ecc71;
            border-radius: 50%;
            position: absolute;
            bottom: 12px; right: 12px;
            border: 2px solid #0d111d;
            z-index: 3;
            animation: blink-dot 1.5s infinite ease-in-out;
        }

        @keyframes blink-dot {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        .edit-btn {
            background-color: #ffcc00; color: #000;
            border: none; padding: 10px 20px;
            border-radius: 8px; font-weight: bold;
            margin-top: 15px; cursor: pointer;
            width: 100%; font-size: 14px;
        }

        .user-info { margin-top: 15px; }
        .email-text { color: #ffcc00; font-size: 18px; font-weight: bold; min-height: 24px; }
        .brand-text { color: #7f8c8d; font-size: 13px; margin-top: 4px; }

        .action-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 25px; }
        .grid-box { background-color: #161b29; padding: 15px 5px; border-radius: 15px; text-align: center; border: 1px solid #2c3e50; cursor: pointer; }
        .grid-box i { font-size: 24px; color: #ffcc00; margin-bottom: 8px; display: block; }
        .grid-box span { font-size: 11px; font-weight: bold; color: #7f8c8d; }

        .pass-box { background-color: #161b29; width: 100%; padding: 15px; border-radius: 15px; text-align: center; border: 1px solid #2c3e50; margin-top: 15px; cursor: pointer; }
        
        .section-title { color: #ffcc00; font-size: 18px; font-weight: bold; margin: 30px 0 15px 5px; border-left: 4px solid #ffcc00; padding-left: 10px; }
        .policy-card { background-color: #161b29; border-radius: 15px; overflow: hidden; }
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #2c3e50; }
        .item-left i { font-size: 20px; margin-right: 15px; background: #2c3e50; padding: 10px; border-radius: 10px; color: #ffcc00; }
        .view-btn { background-color: #ffcc00; color: #000; border: none; padding: 6px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; }

        .logout-box { margin-top: 25px; background-color: #161b29; border-radius: 15px; padding: 15px; display: flex; align-items: center; justify-content: center; border: 1px solid #e74c3c; color: #e74c3c; cursor: pointer; font-weight: bold; }

        .bottom-nav { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; background-color: #161b29; display: flex; justify-content: space-around; align-items: center; padding: 10px 5px; border-radius: 50px; border: 1px solid #2c3e50; z-index: 1000; }
        .nav-item { text-decoration: none; color: #7f8c8d; display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; }
        .nav-item i { font-size: 20px; }
        .nav-item span { font-size: 11px; font-weight: bold; }
        .nav-item.active { color: #ffcc00; }
        .nav-item.active .icon-circle { background-color: #ffcc00; color: #000; width: 50px; height: 32px; border-radius: 20px; display: flex; align-items: center; justify-content: center; }

        /* --- Custom Logout Modal Styling --- */
        #logoutModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 99999;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: #161b29;
            border: 1px solid #2c3e50;
            padding: 25px;
            border-radius: 20px;
            width: 85%;
            max-width: 320px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .modal-content p {
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-cancel {
            background-color: #2c3e50;
            color: #ffffff;
        }

        .btn-ok {
            background-color: #e74c3c;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div id="globalLoaderEl">
        <iframe src="loading.html" style="width:100%; height:100%; border:none;"></iframe>
    </div>

    <!-- Custom Logout Confirmation Modal -->
    <div id="logoutModal">
        <div class="modal-content">
            <p>Do you want to logout?</p>
            <div class="modal-buttons">
                <button class="modal-btn btn-cancel" onclick="closeLogoutModal()">Cancel</button>
                <button class="modal-btn btn-ok" onclick="confirmLogout()">OK</button>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="top-header">
            <div class="back-btn" onclick="window.location.href='index.html'">
                <i class="fas fa-arrow-left"></i>
                <span>Profile</span>
            </div>
            <div class="wallet-badge" onclick="window.location.href='wallet.html'">
                <i class="fas fa-wallet"></i>
                <span id="userWalletTop">0.00</span>
                <div class="add-icon">+</div>
            </div>
        </div>

        <div class="header">
            <div class="profile-img-box">
                <img id="userImg" src="" class="profile-img" style="display:none;">
                <div id="userInitial" class="profile-initial" style="display:none;"></div>
                <span class="status-dot"></span>
            </div>
            
            <button class="edit-btn" onclick="window.location.href='edit.html'">
                <i class="fas fa-edit"></i> Edit Your Profile
            </button>

            <div class="user-info">
                <h2 id="userNameDisplay" class="email-text"></h2>
                <p id="userEmailDisplay" class="brand-text">Awan brand</p>
            </div>
        </div>

        <div class="action-grid">
            <div class="grid-box" onclick="window.location.href='wallet.html'">
                <i class="fas fa-wallet"></i><span>MY WALLET</span>
            </div>
            <div class="grid-box" onclick="window.location.href='rewards.html'">
                <i class="fas fa-gift"></i><span>MY REWARD</span>
            </div>
            <div class="grid-box" onclick="window.location.href='support.html'">
                <i class="fas fa-headset"></i><span>APP SUPPORT</span>
            </div>
        </div>

        <div style="display: flex; gap: 12px; margin-top: 15px;">
            <div class="pass-box" style="margin-top: 0; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 12px;" onclick="window.location.href='chang.html'">
                <i class="fas fa-key" style="color: #ffcc00; font-size: 20px;"></i>
                <span style="font-weight: bold; font-size: 11px; line-height: 1.2;">CHANGE<br>PASSWORD</span>
            </div>

            <div class="pass-box" style="margin-top: 0; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 12px;" onclick="window.location.href='join.html'">
                <i class="fas fa-trophy" style="color: #ffcc00; font-size: 20px;"></i>
                <span style="font-weight: bold; font-size: 11px; line-height: 1.2;">MY JOIN<br>TOURNAMENT</span>
            </div>
        </div>

        <div class="section-title">WARNING & APP POLICY</div>
        <div class="policy-card">
            <div class="list-item">
                <div class="item-left"><i class="fas fa-exclamation-triangle"></i><span>Warning</span></div>
                <button class="view-btn" onclick="window.location.href='warrning.html'">View</button>
            </div>
            <div class="list-item">
                <div class="item-left"><i class="fas fa-file-contract"></i><span>App Policy</span></div>
                <button class="view-btn" onclick="window.location.href='policy.html'">View</button>
            </div>
        </div>

        <div class="logout-box" onclick="logoutAccount()"><i class="fas fa-sign-out-alt"></i><span>LOGOUT ACCOUNT</span></div>
    </div>

    <div class="bottom-nav">
        <a href="index.html" class="nav-item"><i class="fas fa-home"></i><span>Home</span></a>
        <a href="stile.html" class="nav-item"><i class="fas fa-gamepad"></i><span>Tournaments</span></a>
        <a href="control.html" class="nav-item"><i class="fas fa-trophy"></i><span>Leaderboard</span></a>
        <a href="javascript:void(0)" class="nav-item active" onclick="handleProfileNav()">
            <div class="icon-circle"><i class="fas fa-user-circle"></i></div><span>Profile</span>
        </a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
        // Loader Control Logic
        window.onload = function() {
            const loader = document.getElementById('globalLoaderEl');
            setTimeout(() => {
                loader.style.opacity = '0';
                setTimeout(() => {
                    loader.style.display = 'none';
                }, 500);
            }, 1000); 
        };

        function handleProfileNav() {
            console.log("Already on Profile page.");
        }

        const firebaseConfig = {
            apiKey: "AIzaSyANjbQLKEpV0Mj5e5PJzCPZvFo8a5vzy_k",
            authDomain: "ff-tournamint-323ac.firebaseapp.com",
            databaseURL: "https://ff-tournamint-323ac-default-rtdb.firebaseio.com",
            projectId: "ff-tournamint-323ac",
            storageBucket: "ff-tournamint-323ac.firebasestorage.app",
            appId: "1:157085748163:web:848536d10ae58d32398b76"
        };
        
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const database = firebase.database();

        const nameDisplay = document.getElementById('userNameDisplay');
        const emailDisplay = document.getElementById('userEmailDisplay');
        const walletTop = document.getElementById('userWalletTop');
        const userImg = document.getElementById('userImg');
        const userInitial = document.getElementById('userInitial');

        const cachedName = localStorage.getItem('user_name');
        const cachedEmail = localStorage.getItem('user_email');
        const cachedPic = localStorage.getItem('user_pic');
        const cachedWallet = localStorage.getItem('user_balance');

        if (cachedName) nameDisplay.innerText = cachedName;
        if (cachedEmail) emailDisplay.innerText = cachedEmail;
        if (cachedWallet) walletTop.innerText = cachedWallet;
        
        // Default avatar fallback if cached picture is missing
        const defaultAvatarUrl = "https://cdn-icons-png.flaticon.com/512/149/149071.png";
        userImg.src = cachedPic || defaultAvatarUrl;
        userImg.style.display = 'block';
        userInitial.style.display = 'none';

        firebase.auth().onAuthStateChanged(function(user) {
            if (user) {
                emailDisplay.innerText = user.email;
                localStorage.setItem('user_email', user.email);

                database.ref('users/' + user.uid).on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        const currentName = data.name || data.displayName || data.username || "Gamer";
                        const currentPic = data.profilePic || "https://cdn-icons-png.flaticon.com/512/149/149071.png";
                        
                        let balanceValue = "0.00";
                        if (data.wallet !== undefined && data.wallet !== null) {
                            balanceValue = data.wallet;
                        } else if (data.balance !== undefined && data.balance !== null) {
                            balanceValue = data.balance;
                        }

                        nameDisplay.innerText = currentName;
                        walletTop.innerText = balanceValue;
                        
                        localStorage.setItem('user_name', currentName);
                        localStorage.setItem('user_balance', balanceValue);

                        userImg.src = currentPic;
                        userImg.style.display = 'block';
                        userInitial.style.display = 'none';
                        localStorage.setItem('user_pic', currentPic);
                    }
                });
            } else {
                window.location.href = "login-register.html";
            }
        });

        function logoutAccount() {
            document.getElementById('logoutModal').style.display = 'flex';
        }

        function closeLogoutModal() {
            document.getElementById('logoutModal').style.display = 'none';
        }

        function confirmLogout() {
            localStorage.clear();
            firebase.auth().signOut().then(() => {
                window.location.href = "login-register.html";
            });
        }
    </script>
</body>
</html>
