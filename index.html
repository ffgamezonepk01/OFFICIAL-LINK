                    <div style="text-align: center; padding: 40px 20px; background: #1c1c3d; border-radius: 15px; border: 1px dashed #444;">
                        <i class="fa-solid fa-trophy" style="font-size: 50px; color: #444; margin-bottom: 15px; display: block;"></i>
                        <div style="color: #666; font-weight: 800; font-size: 14px; text-transform: uppercase;">No Tournaments Available</div>
                    </div>`;
                    return;
                }

                homeList.innerHTML = "";
                snapshot.forEach((child) => {
                    const t = child.val();
                    
                    let matchPhoto = "https://img.tapimg.com/market/images/154c5520445d4705a6e9a6e114675549.png"; 
                    let modeType = (t.type || "").toLowerCase();
                    let matchTitle = (t.title || "").toLowerCase();

                    if (modeType.includes("clash squad") || matchTitle.includes("clash squad")) {
                        matchPhoto = "https://i.ibb.co/KzDtz9n7/IMG-20260501-192229.png";
                    } else if (modeType.includes("lon wolf") || matchTitle.includes("lon wolf") || modeType.includes("lone wolf") || matchTitle.includes("lone wolf")) {
                        matchPhoto = "https://i.ibb.co/0j51DGdJ/IMG-20260501-192115.png";
                    } else if (modeType.includes("battle royale") || matchTitle.includes("battle royale")) {
                        matchPhoto = "https://i.ibb.co/39qtDmLr/IMG-20260501-192201.png";
                    }

                    let joined = allRegs.filter(r => r.matchId === t.id).length;
                    let totalSlots = parseInt(t.totalSlots) || 48;
                    let isFull = joined >= totalSlots;

                    let isPerKillMatch = (t.perKill && t.perKill !== "HIDE" && t.perKill !== "0" && t.perKill !== 0);
                    let winPrize = (t.prizeDistribution && t.prizeDistribution.rank1) ? t.prizeDistribution.rank1 : (t.totalPrize || "0");

                    let displayTime = t.mTime || 'TBA';
                    if (t.mTime && t.mTime.includes(':')) {
                        let parts = t.mTime.split(':');
                        let hours = parseInt(parts[0]);
                        let minutes = parts[1];
                        
                        if (!isNaN(hours)) {
                            let ampm = hours >= 12 ? 'PM' : 'AM';
                            hours = hours % 12;
                            hours = hours ? hours : 12; 
                            
                            let cleanMinutes = minutes.replace(/AM|PM|am|pm|\s/g, '');
                            displayTime = hours + ':' + cleanMinutes + ' ' + ampm;
                        }
                    }

                    homeList.innerHTML += `
                    <div onclick="window.location.href='stile.html'" style="background: #1c1c3d; border-radius: 15px; padding: 12px; display: flex; align-items: center; gap: 12px; border: 1px solid ${isFull ? 'rgba(255, 77, 77, 0.4)' : '#2d2d5a'}; cursor: pointer; position: relative; overflow: hidden;">
                        
                        <div style="position: absolute; top: 0; left: 0; background: ${isFull ? '#ff4d4d' : '#facc15'}; color: ${isFull ? '#fff' : '#000'}; font-size: 8px; font-weight: 900; padding: 2px 8px; border-bottom-right-radius: 8px;">ID: ${t.tourneyNum || '00'}</div>

                        <img src="${matchPhoto}" style="width: 75px; height: 75px; border-radius: 12px; object-fit: cover; margin-top: 5px;">
                        
                        <div style="flex: 1;">
                            <div style="font-weight: 900; color: #fff; font-size: 14px; margin-bottom: 2px; text-transform: uppercase;">${t.title}</div>
                            
                            <div style="display: flex; gap: 8px; margin-bottom: 8px; align-items: center;">
                                 <span style="color: #aaa; font-size: 9px;">${t.type || 'Solo'}</span>
                                 <span style="color: #facc15; font-size: 9px;">•</span>
                                 <span style="color: #aaa; font-size: 9px;">${t.version || 'Map'}</span>
                                 <span style="color: #facc15; font-size: 9px;">•</span>
                                 <span style="color: ${isFull ? '#ff4d4d' : '#fff'}; font-size: 9px; font-weight: bold;">Slots: ${joined}/${totalSlots}</span>
                            </div>
                            
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; border-top: 1px solid #2d2d5a; padding-top: 8px;">
                                <div>
                                    <div style="color: #888; font-size: 7px; text-transform: uppercase;">Entry</div>
                                    <div style="color: #fff; font-weight: 800; font-size: 10px;">Rs.${t.entryFee}</div>
                                </div>
                                
                                ${isPerKillMatch ? `
                                <div>
                                    <div style="color: #888; font-size: 7px; text-transform: uppercase;">Per Kill</div>
                                    <div style="color: #facc15; font-weight: 800; font-size: 10px;">Rs.${t.perKill}</div>
                                </div>` : `
                                <div>
                                    <div style="color: #888; font-size: 7px; text-transform: uppercase;">Winner</div>
                                    <div style="color: #fff; font-weight: 800; font-size: 10px;">Rs.${winPrize}</div>
                                </div>`}
                            </div>
                        </div>

                        <div style="background: ${isFull ? 'rgba(255, 77, 77, 0.15)' : '#2a1b4d'}; padding: 6px; border-radius: 10px; min-width: 70px; text-align: center; border: 1px solid ${isFull ? '#ff4d4d' : '#4a2b8d'};">
                            <div style="color: #aaa; font-size: 7px; font-weight: bold; text-transform: uppercase;">Starts In</div>
                            <div style="color: ${isFull ? '#ff4d4d' : '#fff'}; font-weight: 900; font-size: 10px; margin-top: 2px;">${isFull ? 'FULL' : displayTime}</div>
                            <div style="color: #facc15; font-size: 7px; margin-top: 2px; font-weight:bold;">${isFull ? '' : (t.mDate || '')}</div>
                        </div>
                    </div>
                    `;
                });
            });
        });
    }
}

                 content = `<div class="text-center p-5"><h2 class="text-white">${sectionId.replace('-section', '').toUpperCase()}</h2><p class="text-secondary">This page is under construction.</p></div>`;

        function showSection(sectionId, data = {}) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            const targetSection = getElement(sectionId);
            if(targetSection) {
                renderPageContent(sectionId);
                targetSection.classList.add('active');
                attachEventListenersForSection(sectionId, data);
            }
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.toggle('active', item.dataset.section === sectionId);
            });
            const isHomePage = sectionId === 'home-section';
            getElement('headerUserInfo').style.display = isHomePage ? 'flex' : 'none';
            getElement('headerBackBtn').style.display = isHomePage ? 'none' : 'block';
            getElement('headerPageTitle').style.display = isHomePage ? 'none' : 'block';
            if (!isHomePage) {
                getElement('headerPageTitle').textContent = sectionId.replace('-section', '').replace(/^\w/, c => c.toUpperCase());
            }
        }

        function populateUserInfo(profile) {
    const displayName = profile.displayName || 'user';

    const nameEl = getElement('headerUserGreeting');
    const avatarEl = getElement('headerAvatar');
    const balanceEl = getElement('headerChipBalance');

    if (nameEl) nameEl.textContent = displayName;

    if (avatarEl) {
        avatarEl.src = profile.profilePic || "https://via.placeholder.com/100"
    }

    if (balanceEl) {
        balanceEl.textContent = (profile.wallet || 0).toFixed(2);
    }
}

function updateNotificationBadge() {
    const badge = document.getElementById('notif-badge');
    if (!badge || !currentUser) return;

    const notifRef = ref(db, 'notifications/' + currentUser.uid);

    onValue(notifRef, (snapshot) => {
        if (!snapshot.exists()) {
            badge.style.display = 'none';
            return;
        }

        const totalInDb = Object.keys(snapshot.val()).length;
        let lastSeenCount = localStorage.getItem('lastReadCount');

        if (lastSeenCount === null) {
            localStorage.setItem('lastReadCount', totalInDb);
            badge.style.display = 'none';
            return;
        }

        lastSeenCount = parseInt(lastSeenCount);
        const newMessages = totalInDb - lastSeenCount;

        if (newMessages > 0) {
            badge.innerText = newMessages > 9 ? "9+" : newMessages;
            badge.style.display = 'flex';
        } else {
            badge.style.display = 'none';
        }
    });
}

window.resetNotifBadge = function () {
    const badge = document.getElementById('notif-badge');

    get(ref(db, 'notifications/' + currentUser.uid)).then((snapshot) => {
        if (snapshot.exists()) {
            const totalInDb = Object.keys(snapshot.val()).length;
            localStorage.setItem('lastReadCount', totalInDb);
        }

        if (badge) {
            badge.style.display = 'none';
        }

        window.location.href = 'notification.html';
    });
};

        function populateProfilePage(profile) {
    const emailEl = document.getElementById('profileEmailText');
    const nameEl = document.getElementById('profileNameText');
    const imgEl = document.getElementById('bigProfileImg');

    if (emailEl) emailEl.textContent = profile.email || '';
    if (nameEl) nameEl.textContent = profile.displayName || '';
    if (imgEl) imgEl.src = profile.profilePic || "https://via.placeholder.com/120";
}

        function setupRealtimeListeners(uid) {
            detachAllDbListeners();
            const userRef = ref(db, `users/${uid}`);
            dbListeners.userProfile = onValue(userRef, (snapshot) => {
                if (snapshot.exists()) {
                    userProfile = snapshot.val();
                    populateUserInfo(userProfile);
                    if (getElement('profile-section').classList.contains('active')) {
                        populateProfilePage(userProfile);
                    }
                } else { signOut(auth); }
            });
        }
        
        function detachAllDbListeners() {
            if(dbListeners.userProfile && typeof dbListeners.userProfile === 'function') {
                dbListeners.userProfile(); 
            }
            dbListeners = {};
        }

        async function handleAuthStateChange(user) {
            showLoader(true);
            detachAllDbListeners(); 
            currentUser = user;

            if (user) {
                const userRef = ref(db, 'users/' + user.uid);
                const snapshot = await get(userRef);

                if (!snapshot.exists()) {
                    const nameFromEmail = user.email.split('@')[0];
                    const newUserProfile = {
                        uid: user.uid,
                        displayName: nameFromEmail,
                        email: user.email,
                        wallet: 0,
                        createdAt: serverTimestamp()
                    };
                    await set(userRef, newUserProfile);
                }

                setupRealtimeListeners(user.uid);
                updateNotificationBadge(); 

                showLoader(false); 
                showSection('home-section');

            } else {
                userProfile = {};
                showLoader(false);
                if (!window.location.href.includes('login-register.html')) {
                    window.location.href = "login-register.html";
                }
            }
        }

        async function loadAppSettings() {
            try {
                const snapshot = await get(ref(db, 'settings'));
                if (snapshot.exists()) {
                    appSettings = snapshot.val() || {};
                    const loginLogoEl = getElement('loginLogoEl');
                    if (loginLogoEl && appSettings.userAppLogoUrl) {
                        loginLogoEl.src = appSettings.userAppLogoUrl;
                    }
                }
            } catch(e) { console.error("Could not load app settings:", e); }
        }
        
        async function loadPromotions() {
            if (typeof Swiper === 'undefined') {
                console.error('Swiper JS is not loaded.');
                return;
            }

            const sliderContainer = getElement('promotionSlider');
            if (!sliderContainer) return;

            const sliderWrapper = sliderContainer.querySelector('.swiper-wrapper');
            if (!sliderWrapper) return;
            
            sliderWrapper.innerHTML = '<div class="swiper-slide"><div class="spinner-border text-light" role="status"></div></div>';

            try {
                const promotionsRef = ref(db, 'promotions');
                const snapshot = await get(promotionsRef);

                sliderWrapper.innerHTML = ''; 

                if (snapshot.exists()) {
                    const promotions = snapshot.val();
                    Object.values(promotions).forEach(promo => {
                        if (promo.imageUrl) {
                            sliderWrapper.innerHTML += `
                                <div class="swiper-slide">
                                    <a href="${promo.link || '#'}"><img src="${promo.imageUrl}" alt="Promotion"></a>
                                </div>
                            `;
                        }
                    });

                    if (sliderContainer.swiper) {
                        sliderContainer.swiper.destroy(true, true);
                    }

                    new Swiper(sliderContainer, {
                        slidesPerView: 1,      
                        spaceBetween: 15,        
                        centeredSlides: true,    
                        loop: true,
                        autoplay: {
                            delay: 2500,
                            disableOnInteraction: false,
                        },
                        pagination: {
                            el: '.swiper-pagination',
                            clickable: true,
                        },
                    });
                    sliderContainer.style.display = 'block';

                } else {
                    sliderContainer.style.display = 'none';
                }
            } catch (error) {
                console.error("Error loading promotions:", error);
                sliderWrapper.innerHTML = '<div class="swiper-slide"><p class="text-danger p-3">Could not load promotions.</p></div>';
            }
        }

        async function loadGameCategories() {
            const gamesListEl = getElement('gamesListEl');
            if (!gamesListEl) return;
            gamesListEl.innerHTML = '<p>Loading Categories...</p>';
            try {
                const gamesSnapshot = await get(ref(db, 'games'));
                if (!gamesSnapshot.exists()) { gamesListEl.innerHTML = '<p>No game categories found.</p>'; return; }
                gamesListEl.innerHTML = '';
                const games = gamesSnapshot.val();
                appSettings.games = games;
                Object.entries(games).forEach(([gameId, gameData]) => {
                    const card = document.createElement('div');
                    card.className = 'game-card';
                    card.innerHTML = `<img src="${gameData.imageUrl}" alt="${gameData.name}">`;
                    card.addEventListener('click', () => {
                        showSection('tournaments-section', { gameId: gameId, status: 'upcoming' });
                    });
                    gamesListEl.appendChild(card);
                });
            } catch (e) { console.error("Error loading games:", e); gamesListEl.innerHTML = '<p class="text-danger">Failed to load categories.</p>'; }
        }
        
        async function joinTournament(tournamentId, entryFee) {
            if (!currentUser) {
                alert("Login required!");
                return;
            }

            const userRef = ref(db, 'users/' + currentUser.uid);
            const snapshot = await get(userRef);

            if (!snapshot.exists()) {
                alert("User not found!");
                return;
            }

            const userData = snapshot.val();
            const walletBalance = parseFloat(userData.wallet || 0);

            if (walletBalance < entryFee) {
                alert("Low Balance!");
                return;
            }

            const newBalance = walletBalance - entryFee;

            await set(ref(db, 'users/' + currentUser.uid + '/wallet'), newBalance);

            await set(ref(db, `tournaments/${tournamentId}/participants/${currentUser.uid}`), {
                uid: currentUser.uid,
                name: userProfile.displayName || "User",
                joinedAt: Date.now()
            });

            alert("Successfully Joined!");
        }

        async function loadUserTournaments(statusType) {
            const container = document.getElementById('tournaments-section');
            container.innerHTML = "<p>Loading...</p>";

            try {
                const snapshot = await get(ref(db, 'tournaments'));

                if (!snapshot.exists()) {
                    container.innerHTML = "<p>No tournaments found</p>";
                    return;
                }

                const tournaments = snapshot.val();
                container.innerHTML = "";

                Object.entries(tournaments).forEach(([id, tour]) => {
                    const isJoined = tour.participants && tour.participants[currentUser.uid];

                    if (isJoined && tour.status === statusType) {
                        container.innerHTML += `
                            <div class="tournament-card">
                                <h3>${tour.name}</h3>
                                <p>Entry Fee: ${tour.entryFee}</p>
                                <p>Status: ${tour.status}</p>
                                <p>Your UID: ${tour.participants[currentUser.uid].uid}</p>
                            </div>
                        `;
                    }
                });

                if (container.innerHTML === "") {
                    container.innerHTML = "<p>No joined tournaments found</p>";
                }

            } catch (e) {
                console.error(e);
                container.innerHTML = "<p>Error loading tournaments</p>";
            }
        }

        function attachEventListenersForSection(sectionId, data) {
            if (sectionId === 'home-section') {
                loadPromotions();
                loadGameCategories();

                document.querySelectorAll('.category-card').forEach(card => {
                    card.addEventListener('click', () => {
                        const status = card.getAttribute('data-status-target');

                        if (status === "upcoming") {
                            window.location.href = "stile.html";
                        } 
                        else if (status === "ongoing") {
                            showSection('tournaments-section', { status: 'ongoing' });
                        }
                        else if (status === "completed") {
                            showSection('tournaments-section', { status: 'completed' });
                        }
                    });
                });
            }
            
            if (sectionId === 'profile-section') {
                populateProfilePage(userProfile);
                getElement('logoutBtn').onclick = () => { if(confirm('Are you sure?')) signOut(auth); };
                querySel('#profile-section').querySelectorAll('.menu-item[data-section]').forEach(item => {
                    item.addEventListener('click', (e) => { e.preventDefault(); showSection(item.dataset.section); });
                });
            }
            if(sectionId === 'tournaments-section' && data.gameId) {
                loadMatchesForCategory(data.gameId, data.status || 'upcoming');
                querySel('#tournaments-section').querySelectorAll('.tab-item').forEach(tab => {
                    tab.addEventListener('click', () => {
                        querySel('#tournaments-section').querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
                        tab.classList.add('active');
                        loadMatchesForCategory(data.gameId, tab.dataset.status);
                    });
                });
            }
        }
        
        function initializeGlobalEventListeners() {
            document.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    const href = item.getAttribute('href');
                    if (href && href !== "#") {
                        return; 
                    }
                    e.preventDefault(); 
                    if (item.dataset.section) {
                        showSection(item.dataset.section); 
                    }
                });
            });
            getElement('headerBackBtn').addEventListener('click', () => showSection('home-section'));
        }

        function checkNetworkStatus() {
            const offlineOverlay = getElement('offlineOverlay');
            if (!navigator.onLine) {
                if (offlineOverlay) offlineOverlay.style.display = 'flex';
                showLoader(false);
            } else {
                if (offlineOverlay) offlineOverlay.style.display = 'none';
            }
        }

        window.addEventListener('online', checkNetworkStatus);
        window.addEventListener('offline', checkNetworkStatus);
        
        document.addEventListener('DOMContentLoaded', async () => {
            checkNetworkStatus();
            if (!navigator.onLine) return;

            if(!auth) return;
            showLoader(true);
            initializeGlobalEventListeners();
            checkAppVersion(); // Check version logic initialized here
            await loadAppSettings(); 
            onAuthStateChanged(auth, handleAuthStateChange);
        });
    </script>
